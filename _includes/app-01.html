<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050505">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>愛車ログ | 愛車維持費ログ</title>
<style>
:root{
  --bg:#050505;
  --panel:#0d0d0f;
  --panel2:#121215;
  --line:#27272a;
  --line2:#3f3f46;
  --text:#f4f4f5;
  --muted:#a1a1aa;
  --dim:#71717a;
  --white:#ffffff;
  --accent:#e4e4e7;
  --danger:#ef4444;
  --success:#22c55e;
  --shadow:0 18px 48px rgba(0,0,0,.45);
  --r:20px;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{
  margin:0;background:
  radial-gradient(circle at 85% -5%,rgba(255,255,255,.08),transparent 25%),
  linear-gradient(180deg,#09090b 0%,#050505 46%,#050505 100%);
  color:var(--text);
  font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.app{max-width:820px;margin:auto;min-height:100dvh;padding-bottom:96px}
header{
  display:flex;justify-content:space-between;align-items:flex-end;
  padding:24px 18px 13px;
}
.logo{font-weight:900;letter-spacing:.18em;font-size:18px}
.logo small{display:block;color:var(--muted);font-size:9px;letter-spacing:.22em;margin-top:4px}
.year{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:7px 10px}
main{padding:0 14px}
.view{display:none}.view.active{display:block}

.card{
  background:linear-gradient(180deg,rgba(19,19,22,.98),rgba(12,12,14,.98));
  border:1px solid var(--line);
  border-radius:var(--r);
  box-shadow:var(--shadow);
  padding:16px;margin:10px 0;
}
.hero{
  height:300px;padding:0;overflow:hidden;position:relative;background:
  linear-gradient(135deg,#18181b,#09090b);
}
.hero img{width:100%;height:100%;object-fit:cover;display:block;filter:saturate(.88) contrast(1.04)}
.hero::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(0,0,0,.04),rgba(0,0,0,.08) 45%,rgba(0,0,0,.88));
  pointer-events:none;
}
.hero-copy{position:absolute;z-index:2;left:19px;right:19px;bottom:17px}
.hero-kicker{font-size:10px;color:#d4d4d8;letter-spacing:.18em;font-weight:800}
.hero h1{margin:5px 0 3px;font-size:29px;line-height:1.05;letter-spacing:.01em}
.hero p{margin:0;color:#d4d4d8;font-size:12px}
.hero-empty{display:grid;place-items:center;text-align:center}
.hero-empty::after{background:linear-gradient(180deg,rgba(255,255,255,.02),rgba(0,0,0,.4))}
.hero-empty .mark{font-size:48px;opacity:.82;margin-bottom:8px}

.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.metric{min-height:112px;display:flex;flex-direction:column;justify-content:space-between}
.metric .label{font-size:10px;color:var(--muted);font-weight:800;letter-spacing:.08em}
.metric .value{font-size:24px;font-weight:900;letter-spacing:-.03em}
.metric .sub{font-size:10px;color:var(--dim);margin-top:3px}
