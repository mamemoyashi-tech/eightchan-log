 toll:["↝","高速・有料道路"],
 wash:["✦","洗車・用品"],
 custom:["＋","カスタム"],
 other:["•","その他"]
};

const num=n=>new Intl.NumberFormat("ja-JP").format(Number(n||0));
const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));

function dbOpen(){
 return new Promise((resolve,reject)=>{
  const req=indexedDB.open("garage_log_db",1);
  req.onupgradeneeded=e=>e.target.result.createObjectStore("store");
  req.onsuccess=()=>resolve(req.result);
  req.onerror=()=>reject(req.error);
 });
}
async function dbGet(){
 const db=await dbOpen();
 return new Promise(resolve=>{
  const req=db.transaction("store","readonly").objectStore("store").get("state");
  req.onsuccess=()=>resolve(req.result);req.onerror=()=>resolve(null);
 });
}
async function dbSet(){
 const db=await dbOpen();
 return new Promise((resolve,reject)=>{
  const req=db.transaction("store","readwrite").objectStore("store").put(state,"state");
  req.onsuccess=()=>resolve();req.onerror=()=>reject(req.error);
 });
}

async function init(){
 const saved=await dbGet(); if(saved)state=saved;
 state.vehicle=state.vehicle||{};state.entries=Array.isArray(state.entries)?state.entries:[];
 state.recurringRules=Array.isArray(state.recurringRules)?state.recurringRules:[];
 state.recurringSkips=Array.isArray(state.recurringSkips)?state.recurringSkips:[];
 $("headerYear").textContent=new Date().getFullYear()+" / EIGHT";
 fillCategories();
 $("entryDate").value=today();
 $("recurringStart").value=today().slice(0,7);$("recurringCategory").value="parking";
 $("carPhoto").addEventListener("change",handleCarPhoto);
 $("entryPhoto").addEventListener("change",handleEntryPhoto);
