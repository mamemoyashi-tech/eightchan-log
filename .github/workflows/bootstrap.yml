name: Bootstrap Eightchan Log

on:
  push:
    paths:
      - '.github/workflows/bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack app files
        shell: bash
        run: |
          cat > /tmp/payload.b64 <<'PAYLOAD'

PAYLOAD
          base64 -d /tmp/payload.b64 > /tmp/eightchan.txz
          tar -xJf /tmp/eightchan.txz -C .
      - name: Commit app
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Deploy エイトちゃんLOG' || exit 0
          git push
