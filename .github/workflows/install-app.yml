name: Install Eightchan Log

on:
  push:
    paths:
      - '.github/workflows/install-app.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack app
        run: |
          cat .payload/part*.txt | base64 -d > /tmp/eightchan.txz
          tar -xJf /tmp/eightchan.txz -C .
          rm -rf .payload
          rm -f .github/workflows/install-app.yml
      - name: Commit app files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Deploy エイトちゃんLOG'
          git push
